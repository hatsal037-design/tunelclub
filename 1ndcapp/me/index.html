<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<base href="../">
<title>첫밤사망자클럽</title>
<meta name="description" content="첫밤 사망자 클럽 — 참가·자료실·전적">
<meta name="theme-color" content="#f2f2f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="첫밤사망자클럽">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="app.css">
<style>
  .ad { height: 100px; border-radius: 12px; border: 1px dashed var(--sep, #c6c6c8); display: grid; place-items: center; color: var(--label3, #8e8e93); font-size: 13px; margin: 0 16px 20px; }
  .ad.full { position: fixed; inset: 0; z-index: 50; margin: 0; border: 0; border-radius: 0; background: var(--bg, #f2f2f7); }
  .ad.full button { position: absolute; top: calc(env(safe-area-inset-top) + 12px); right: 16px; }
  .avatar { border-radius: 50%; object-fit: cover; background: var(--fill, #e5e5ea); display: inline-grid; place-items: center; flex: none; overflow: hidden; }
  .stats { display: grid; grid-template-columns: 1fr 1fr 1fr; text-align: center; padding: 12px 0; }
  .stats div + div { border-left: 1px solid var(--sep, #c6c6c8); }
  .stats b { display: block; font-size: 20px; font-variant-numeric: tabular-nums; }
  .stats span { font-size: 12px; color: var(--label2, #8e8e93); }
  .head { display: flex; gap: 14px; align-items: center; padding: 12px 16px; }
</style>
</head>
<body>
<div id="app"><div class="boot">첫밤사망자클럽</div></div>
<script src="lib/supabase.js"></script>
<script src="core/participant.js"></script>
<script type="module" src="me/me.js"></script>
</body>
</html>
